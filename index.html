<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>翻訳と単語帳</title>
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="翻訳">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<style>
/* Layout: iOS「翻訳」アプリと同じ構成。上部に丸ボタン、カード中心の縦レイアウト、下部に浮かぶタブバー。
   Color: 黒地+シアン(翻訳先)を基調、カードは #1c1c1e 系。ライトも iOS に準拠。 */
:root{
  --bg:#f2f2f7; --card:#ffffff; --card2:#f2f2f7; --sheet:#f2f2f7; --sheetcard:#ffffff;
  --fg:#000000; --sub:#6c6c70; --sep:rgba(60,60,67,.2);
  --acc:#0a9fb4; --acc-ink:#ffffff; --acc-soft:rgba(10,159,180,.14);
  --btn:rgba(255,255,255,.85); --ph:rgba(60,60,67,.3); --ph-acc:rgba(10,159,180,.4);
  --red:#e5342d; --green:#2fb344; --scrim:rgba(0,0,0,.35);
  --tab:rgba(255,255,255,.86); --tab-on:rgba(120,120,128,.16);
  --play:#000000; --play-ink:#ffffff;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1c1c1e; --card2:#2c2c2e; --sheet:#1c1c1e; --sheetcard:#2c2c2e;
    --fg:#ffffff; --sub:#98989f; --sep:rgba(84,84,88,.55);
    --acc:#00d1e8; --acc-ink:#00262b; --acc-soft:rgba(0,209,232,.16);
    --btn:rgba(44,44,46,.88); --ph:#48484a; --ph-acc:rgba(0,209,232,.28);
    --red:#ff453a; --green:#32d74b; --scrim:rgba(0,0,0,.55);
    --tab:rgba(28,28,30,.88); --tab-on:#0a0a0b;
    --play:#ffffff; --play-ink:#000000; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --card2:#2c2c2e; --sheet:#1c1c1e; --sheetcard:#2c2c2e;
  --fg:#ffffff; --sub:#98989f; --sep:rgba(84,84,88,.55);
  --acc:#00d1e8; --acc-ink:#00262b; --acc-soft:rgba(0,209,232,.16);
  --btn:rgba(44,44,46,.88); --ph:#48484a; --ph-acc:rgba(0,209,232,.28);
  --red:#ff453a; --green:#32d74b; --scrim:rgba(0,0,0,.55);
  --tab:rgba(28,28,30,.88); --tab-on:#0a0a0b;
  --play:#ffffff; --play-ink:#000000; color-scheme:dark;
}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
html,body{height:100%}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg{display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg .f{fill:currentColor;stroke:none}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;gap:18px;padding-bottom:130px}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;justify-content:space-between;
  min-height:72px;padding:12px 0 8px;background:var(--bg);margin:0 -2px;padding-left:2px;padding-right:2px}
.top h1{position:absolute;left:0;right:0;text-align:center;margin:0;font-size:17px;font-weight:700;pointer-events:none}
.top .grow{flex:1;min-width:0;margin:0 14px}
.gbtn{width:48px;height:48px;border-radius:50%;border:0;background:var(--btn);display:grid;place-items:center;flex:none;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 0 0 .5px var(--sep);position:relative;z-index:1}
.gbtn.pill{width:auto;padding:0 18px 0 12px;border-radius:24px;gap:4px;display:flex;align-items:center;font-size:17px;font-weight:500}
.gbtn.pill.plain{padding:0 20px}
.title-lg{font-size:34px;font-weight:700;line-height:1.15;margin:0 4px;letter-spacing:.01em}
.subline{margin:-8px 4px 0;color:var(--sub);font-size:15px}
/* cards */
.card{background:var(--card);border-radius:30px;padding:22px 24px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.col{min-width:0;flex:1}
.lbl{font-size:14px;font-weight:600;letter-spacing:.02em;color:var(--fg);margin-bottom:4px}
.lbl.acc{color:var(--acc)}
.txt{font-size:28px;font-weight:600;line-height:1.28;overflow-wrap:anywhere;white-space:pre-wrap}
.txt.acc{color:var(--acc)}
.txt.big{font-size:34px}
.hr{height:1px;background:var(--sep);margin:16px 0}
.play{width:40px;height:40px;border-radius:50%;background:var(--play);color:var(--play-ink);border:0;display:grid;place-items:center;flex:none;margin-top:6px}
.play.acc{background:var(--acc);color:var(--acc-ink)}
.play.lg{width:92px;height:92px;margin:0}
.acts{display:flex;gap:30px;margin-top:22px;color:var(--acc)}
.acts button{background:none;border:0;padding:4px;color:inherit;display:grid;place-items:center}
.dots{display:inline-flex;gap:6px;align-items:center;height:36px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--acc);opacity:.35;animation:pulse 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes pulse{50%{opacity:1}}
/* input card */
.inp{padding:20px 24px 24px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--fg);cursor:pointer;padding:2px 0;background:none;border:0}
.chip svg{color:var(--sub)}
.chip.acc{color:var(--acc)}.chip.acc svg{color:var(--sub)}
.fldrow{display:flex;gap:10px;align-items:flex-start}
.ta{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--fg);font:600 28px/1.28 var(--font);resize:none;outline:none;padding:4px 0;min-height:112px;overflow:hidden;display:block}
.ta::placeholder{color:var(--ph);opacity:1}
.ta.acc{color:var(--acc)}.ta.acc::placeholder{color:var(--ph-acc)}
.ta.sm{font-size:24px;min-height:40px}
.micb{background:none;border:0;padding:6px 2px;margin-top:2px;color:var(--fg);flex:none}
.micb.acc{color:var(--acc)}
.swap{display:flex;align-items:center;margin:6px 0 14px}
.swap i{flex:1;height:3px;background:var(--bg)}
.swap button{width:54px;height:54px;border-radius:50%;border:0;background:var(--bg);color:var(--acc);display:grid;place-items:center;flex:none}
.hint{color:var(--sub);font-size:15px;margin:0 6px;text-align:center}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.pillbar{pointer-events:auto;display:flex;gap:2px;padding:6px;border-radius:44px;background:var(--tab);width:100%;max-width:440px;
  -webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4);box-shadow:0 0 0 .5px var(--sep),0 10px 32px rgba(0,0,0,.28)}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;border-radius:36px;border:0;background:none;color:var(--fg);font-size:10.5px;font-weight:600;--glyph:var(--tab)}
.tab[aria-current="true"]{background:var(--tab-on);color:var(--acc);--glyph:var(--tab-on)}
.tab svg text{fill:var(--glyph);stroke:none;font-family:var(--font);font-weight:700}
.tab svg .g{stroke:var(--glyph)}
/* sheets */
.sheet{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;justify-content:center;align-items:flex-end;animation:fade .2s ease-out}
.panel{--card:var(--sheetcard);width:100%;max-width:520px;height:calc(100% - env(safe-area-inset-top,0px) - 44px);background:var(--sheet);border-radius:40px 40px 0 0;
  overflow-y:auto;padding:0 max(16px,env(safe-area-inset-left,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));
  animation:rise .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:18px}
.panel.sm{height:auto;max-height:86%}
.panel .ptop{position:sticky;top:0;z-index:3;display:flex;justify-content:flex-end;padding:20px 4px 0;margin-bottom:-6px;pointer-events:none}
.panel .ptop .gbtn{pointer-events:auto;background:var(--card2)}
.panel h2{font-size:34px;font-weight:700;margin:0 4px;line-height:1.15}
.panel h3{font-size:22px;font-weight:600;margin:10px 8px 0}
.panel .sm-title{font-size:22px;font-weight:700;margin:-4px 4px 0}
.full{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:22px;
  padding:calc(40px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-left,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-right,0px));animation:fade .2s}
.full .xb{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
.full .big{font-size:clamp(40px,12vw,64px);font-weight:700;line-height:1.2;overflow-wrap:anywhere;color:var(--acc);max-height:60vh;overflow:auto}
.full .src{font-size:22px;font-weight:600;color:var(--sub);overflow-wrap:anywhere}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.list{padding:6px 24px}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:15px 0;border-bottom:1px solid var(--sep);font-size:18px}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .s{color:var(--sub);font-size:14px;font-weight:400;margin-top:2px}
.li .t{font-weight:600;font-size:20px;overflow-wrap:anywhere}
.li .chk{color:var(--acc);width:24px;flex:none}
.li .chev{color:var(--sub)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ph);flex:none}
.dot.ok{background:var(--green)}.dot.ng{background:var(--red)}
/* menu */
.menuwrap{position:fixed;inset:0;z-index:60;display:flex;justify-content:center}
.menuin{width:100%;max-width:520px;position:relative}
.menu{position:absolute;top:calc(env(safe-area-inset-top,0px) + 74px);right:max(16px,env(safe-area-inset-right,0px));min-width:250px;background:var(--card2);border-radius:26px;padding:8px;
  box-shadow:0 12px 40px rgba(0,0,0,.35),0 0 0 .5px var(--sep);animation:pop .16s ease-out;transform-origin:top right}
.menu.l{right:auto;left:max(16px,env(safe-area-inset-left,0px));transform-origin:top left}
.menu button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:13px 14px;border-radius:18px;font-size:17px;text-align:left}
.menu button:active{background:var(--tab-on)}
.menu .ck{width:20px;color:var(--fg);flex:none}
.menu .red{color:var(--red)}
.menu hr{border:0;border-top:1px solid var(--sep);margin:6px 8px}
@keyframes pop{from{transform:scale(.9);opacity:0}}
/* toast */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translate(-50%,-20px);z-index:80;background:var(--card2);color:var(--fg);padding:12px 20px;border-radius:24px;font-size:15px;font-weight:600;
  box-shadow:0 8px 28px rgba(0,0,0,.3),0 0 0 .5px var(--sep);opacity:0;pointer-events:none;transition:.25s;max-width:min(92vw,440px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* buttons / forms */
.cta{background:var(--acc);color:var(--acc-ink);border:0;border-radius:30px;padding:18px 24px;font-size:19px;font-weight:700;width:100%}
.cta.ghost{background:var(--card);color:var(--acc)}
.cta.danger{background:var(--red);color:#fff}
.cta:disabled{opacity:.45}
.field{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-bottom:1px solid var(--sep)}
.field:last-child{border-bottom:0}
.field input,.field textarea{background:none;border:0;color:var(--fg);font:600 22px/1.3 var(--font);outline:none;padding:2px 0;width:100%;resize:none}
.field input::placeholder{color:var(--ph);opacity:1}
.field.acc input{color:var(--acc)}
.seg{display:flex;background:var(--card2);border-radius:20px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:10px 0;border-radius:17px;font-weight:600;font-size:16px}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.panel .seg,.screen .card .seg{background:var(--bg)}
.panel .seg{background:var(--sheet)}
.pos{display:inline-block;font-size:13px;font-weight:700;color:var(--acc);background:var(--acc-soft);border-radius:10px;padding:2px 10px;margin-bottom:6px}
.ex{color:var(--sub);font-size:15px;margin-top:6px}
.empty{color:var(--sub);text-align:center;padding:22px 12px;font-size:15px}
/* camera */
.camwrap{flex:1;display:flex;flex-direction:column;gap:18px;min-height:0}
.view{position:relative;flex:1;min-height:46vh;border-radius:30px;background:var(--card);overflow:hidden;display:grid;place-items:center;text-align:center;padding:24px}
.view img{max-width:100%;max-height:52vh;border-radius:18px;display:block}
.view .br{position:absolute;width:34px;height:34px;border:4px solid var(--acc);opacity:.9}
.view .br.a{top:22px;left:22px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.view .br.b{top:22px;right:22px;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.view .br.c{bottom:22px;left:22px;border-right:0;border-top:0;border-radius:0 0 0 14px}
.view .br.d{bottom:22px;right:22px;border-left:0;border-top:0;border-radius:0 0 14px 0}
.shutters{display:flex;align-items:center;justify-content:center;gap:34px}
.shut{width:78px;height:78px;border-radius:50%;border:4px solid var(--fg);background:none;padding:5px}
.shut i{display:block;width:100%;height:100%;border-radius:50%;background:var(--fg)}
.shutters .gbtn{width:56px;height:56px}
/* chat */
.chat{flex:1;display:flex;flex-direction:column;gap:14px;min-height:calc(100dvh - 150px)}
.msgs{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:12px}
.msg{max-width:84%;background:var(--card);border-radius:24px;padding:14px 18px;display:flex;gap:10px;align-items:flex-start}
.msg.l{align-self:flex-start;border-bottom-left-radius:6px}
.msg.r{align-self:flex-end;border-bottom-right-radius:6px}
.msg .m1{font-size:19px;font-weight:600;overflow-wrap:anywhere}
.msg .m2{font-size:19px;font-weight:600;color:var(--acc);margin-top:6px;overflow-wrap:anywhere}
.msg .play{width:34px;height:34px;margin-top:2px}
.flip{transform:rotate(180deg)}
.bub{background:var(--card);border-radius:26px;padding:12px 18px 10px;width:min(78%,360px)}
.bub.l{align-self:flex-start;border-bottom-left-radius:6px}
.bub.r{align-self:flex-end;border-bottom-right-radius:6px}
.bub.r .ta{color:var(--fg)}
.bub .ta::placeholder{color:var(--ph)}
.micbig{align-self:center;width:96px;height:96px;border-radius:50%;border:0;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;margin-top:4px}
/* quiz */
.prog{flex:1;height:8px;border-radius:4px;background:var(--card2);overflow:hidden;margin:0 14px}
.prog i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .3s}
.cnt{font-weight:700;font-variant-numeric:tabular-nums;min-width:54px;text-align:right}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{width:100%;text-align:left;background:var(--card);border:0;border-radius:24px;padding:18px 22px;font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:12px;overflow-wrap:anywhere}
.opt.ok{box-shadow:inset 0 0 0 3px var(--green)}
.opt.ng{box-shadow:inset 0 0 0 3px var(--red)}
.opt .mk{flex:none}
.fb{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px}
.fb.ok{color:var(--green)}.fb.ng{color:var(--red)}
.score{font-size:64px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums;line-height:1.1}
.rowbtns{display:flex;flex-direction:column;gap:12px}
.pad{height:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.txt{font-size:25px}.ta{font-size:25px}.acts{gap:24px}}
</style>
</head>

<script>
(()=>{
'use strict';
/* ---------- 基本 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const LANGS=[['ja','日本語','ja-JP','テキストを入力'],['en-US','英語 (アメリカ)','en-US','Enter text'],['en-GB','英語 (イギリス)','en-GB','Enter text'],
['zh-CN','中国語 (簡体字)','zh-CN','输入文本'],['zh-TW','中国語 (繁体字)','zh-TW','輸入文字'],['ko','韓国語','ko-KR','텍스트 입력'],
['es','スペイン語','es-ES','Introducir texto'],['fr','フランス語','fr-FR','Saisir le texte'],['de','ドイツ語','de-DE','Text eingeben'],
['it','イタリア語','it-IT','Inserisci testo'],['pt-BR','ポルトガル語 (ブラジル)','pt-BR','Inserir texto'],['ru','ロシア語','ru-RU','Введите текст'],
['ar','アラビア語','ar-SA','أدخل النص'],['th','タイ語','th-TH','ป้อนข้อความ'],['vi','ベトナム語','vi-VN','Nhập văn bản'],['id','インドネシア語','id-ID','Masukkan teks'],
['tr','トルコ語','tr-TR','Metin girin'],['nl','オランダ語','nl-NL','Tekst invoeren'],['pl','ポーランド語','pl-PL','Wpisz tekst'],['hi','ヒンディー語','hi-IN','टेक्स्ट दर्ज करें'],['uk','ウクライナ語','uk-UA','Введіть текст']];
const L=Object.fromEntries(LANGS.map(l=>[l[0],{name:l[1],tts:l[2],ph:l[3]}]));

/* ---------- 内蔵単語 ---------- */
const RAW=`abandon|捨てる
achieve|達成する

/* proxyUrl を空にすると無料の MyMemory API(キー不要)を使います。
   Claude / DeepL などを使いたい場合は、README の Cloudflare Worker を作って URL をここに入れてください。 */
const CONFIG={proxyUrl:'',email:''};
const errMsg=e=>{const c=e&&e.code;
  if(c==='quota')return '無料の翻訳の1日の上限に達しました。明日もう一度お試しください';
  if(c==='ocr')return '写真から文字を読み取れませんでした';
  if(c==='offline'||(e&&e.name==='TypeError'))return 'ネットワークに接続できません';
  return '翻訳できませんでした。もう一度お試しください'};
const decodeHTML=t=>{const d=document.createElement('textarea');d.innerHTML=t;return d.value};
function chunks(text,max){
  const out=[];let cur='';
  for(const part of text.split(/(?<=[。.!?!?\n])/)){
    if((cur+part).length>max&&cur){out.push(cur);cur=''}
    if(part.length>max){for(let i=0;i<part.length;i+=max)out.push(part.slice(i,i+max))}else cur+=part;
  }
  if(cur)out.push(cur);return out;
}
async function mm(q,from,to){
  const u='https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair='+encodeURIComponent(from+'|'+to)+(CONFIG.email?'&de='+encodeURIComponent(CONFIG.email):'');
  const r=await fetch(u);if(!r.ok)throw{code:'upstream'};
  const j=await r.json();
  if(j.responseStatus===429||/QUOTA|LIMIT/i.test(String(j.responseDetails||'')))throw{code:'quota'};
  if(j.responseStatus&&+j.responseStatus!==200)throw{code:'upstream'};
  return j;
}
async function translate(text,from,to){
  if(ME&&window.FB){try{const t=await window.FB.translate(text,L[from].name,L[to].name);if(t){lastEngine='Gemini';return t}}catch(e){console.warn('Gemini失敗、無料翻訳に切り替え',e)}}
  lastEngine='無料翻訳(Geminiは使われていません)';
  if(CONFIG.proxyUrl){
    const r=await fetch(CONFIG.proxyUrl,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,from:L[from].name,to:L[to].name})});
    if(!r.ok)throw{code:'upstream'};const j=await r.json();if(typeof j.t!=='string')throw{code:'upstream'};return j.t;
  }
  const outs=[];
  for(const c of chunks(text,450)){
    if(!c.trim()){outs.push(c);continue}
    const j=await mm(c,from,to);outs.push(decodeHTML(j.responseData.translatedText||''));
  }
  return outs.join('').replace(/\s+$/,'');
}
/* 辞書: 同じ語の別訳を MyMemory の候補から集める */
async function dictLookup(term,from,to){
  const j=await mm(term,from,to);const seen=new Set(),ent=[];
  const add=t=>{t=decodeHTML(String(t||'')).trim();const k=t.toLowerCase();if(t&&!seen.has(k)){seen.add(k);ent.push({meaning:t})}};
  add(j.responseData&&j.responseData.translatedText);
  (j.matches||[]).sort((x,y)=>(y.match||0)-(x.match||0)).forEach(m=>{if(ent.length<6)add(m.translation)});
  return {entries:ent};
}

function copy(text){
  const fb=()=>{try{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();toast(ok?'コピーしました':'コピーできませんでした')}catch(e){toast('コピーできませんでした')}};
  try{navigator.clipboard.writeText(text).then(()=>toast('コピーしました'),fb)}catch(e){fb()}
}
function mic(lang,done){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('音声入力を使えません。キーボードで入力してください');return}
  try{const r=new SR();r.lang=L[lang].tts;r.interimResults=false;
    r.onresult=e=>done(e.results[0][0].transcript);
    r.onerror=()=>toast('マイクを使えません。キーボードで入力してください');
    r.start();toast('聞き取り中…')}catch(e){toast('マイクを使えません。キーボードで入力してください')}
}

async function shrink(file){
  const bmp=await createImageBitmap(file);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',.85));
}
async function onPhoto(file){
  if(!file)return;
  S.cam={url:null,loading:true,blocks:null,err:null,msg:'画像を準備中…'};render();
  try{
    const blob=await shrink(file);
    if(S.cam.url)URL.revokeObjectURL(S.cam.url);
    S.cam.url=URL.createObjectURL(blob);S.cam.msg='文字を読み取り中…(初回は言語データを読み込みます)';render();
    if(ME&&window.FB){
      try{
        S.cam.msg='Geminiで読み取り・翻訳中…';render();
        const bl=await window.FB.photo(blob,L[S.src].name,L[S.dst].name);
        S.cam.blocks=bl.filter(b=>b&&b.s&&b.t).map(b=>{const sameDst=String(b.from||'').indexOf(L[S.dst].name.split(' ')[0])===0;return sameDst?mk(S.dst,S.src,String(b.s),String(b.t)):mk(S.src,S.dst,String(b.s),String(b.t))});
        S.cam.loading=false;render();return;
      }catch(e){console.warn('Gemini画像失敗',e);S.cam.msg='文字を読み取り中…'}
    }
    await loadTess();
    const langs=[TESS[S.src]||'eng'];if(langs[0]!=='eng')langs.push('eng');
    const res=await window.Tesseract.recognize(blob,langs.join('+'));
    const cjk=/^(ja|zh|ko|th)/.test(S.src);
    let paras=((res.data&&res.data.paragraphs)||[]).map(p=>p.text);
    if(!paras.length)paras=String((res.data&&res.data.text)||'').split(/\n{2,}/);
    paras=paras.map(t=>t.replace(/\s*\n\s*/g,cjk?'':' ').replace(cjk?/(?<=[^\x00-\x7f])\s+(?=[^\x00-\x7f])/g:/$^/,'').trim()).filter(t=>t.length>1).slice(0,10);
    S.cam.msg='翻訳中…';render();
    const bl=[];
    for(const t of paras){bl.push(mk(S.src,S.dst,t,await translate(t,S.src,S.dst)))}
    S.cam.loading=false;S.cam.blocks=bl;
  }catch(e){S.cam.loading=false;S.cam.err=errMsg(e)}
  render();
}

function startQuiz(ws){
  const deck=allDecks().find(d=>d.id===S.sdeck)||BUILTIN;
  let list=ws||shuffle(deck.words);
  if(!ws&&S.scount!=='all')list=list.slice(0,+S.scount);
  if(!list.length){toast('この単語帳には単語がありません');return}
  S.quiz={phase:'q',ws:list,i:0,ok:0,wrong:[],done:false,pick:null,spell:'',deck};
  makeQ();render();
  if(S.smode==='spell')speak(S.quiz.ws[0].t,L[S.quiz.ws[0].l].tts);
}
function makeQ(){
  const q=S.quiz,w=q.ws[q.i];q.done=false;q.pick=null;q.spell='';q.right=null;
  if(S.smode==='spell'){q.opts=null;return}
  const field=S.smode==='t2m'?'m':'t';
  const pool=[].concat(q.deck.words,BUILTIN.words).filter(x=>x.l===w.l&&x[field]!==w[field]);
  const seen=new Set([w[field]]),ds=[];
  for(const x of shuffle(pool)){if(!seen.has(x[field])){seen.add(x[field]);ds.push(x[field])}if(ds.length===3)break}
  q.opts=shuffle([w[field]].concat(ds).map(t=>({t,ok:t===w[field]})));
}
function record(w,ok){const s=D.stats[w.id]||(D.stats[w.id]={ok:0,ng:0});ok?s.ok++:s.ng++;save()}
function answer(ok,pick){
  const q=S.quiz;if(q.done)return;const w=q.ws[q.i];
  q.done=true;q.pick=pick;q.right=ok;record(w,ok);if(ok)q.ok++;else q.wrong.push(w);
  render();
  if(ok){q.timer=setTimeout(next,1000)}
}
function next(){
  const q=S.quiz;clearTimeout(q.timer);if(!q||q.phase!=='q')return;
  if(q.i+1>=q.ws.length){q.phase='done';render();return}
  q.i++;makeQ();render();
  if(S.smode==='spell'){const w=q.ws[q.i];speak(w.t,L[w.l].tts)}
}

  if(s.type==='dict'){
    const d=S.dict||{};const it=d.item;
    let b='';
    if(d.loading)b=`<section class="card"><span class="dots"><i></i><i></i><i></i></span></section>`;
    else if(d.err)b=`<section class="card"><p class="empty">${esc(d.err)}</p></section>`;
    else b=(d.data.entries||[]).map(e=>`<section class="card">${e.pos?`<span class="pos">${esc(e.pos)}</span>`:''}<div class="txt" style="font-size:22px">${esc(e.meaning||'')}</div>${e.ex_src?`<div class="ex">${esc(e.ex_src)}<br>${esc(e.ex_dst||'')}</div>`:''}</section>`).join('')||`<section class="card"><p class="empty">辞書の情報が見つかりませんでした</p></section>`;
    return `<div class="sheet" data-act="scrim"><div class="panel" role="dialog" aria-label="辞書">${ptop()}<h2>${esc(it.from==='ja'?it.t:it.s)}</h2>${d.data&&d.data.reading?`<p class="subline" style="margin-top:-10px">${esc(d.data.reading)}</p>`:''}${b}<button class="cta" data-act="dict-add">単語帳に追加</button></div></div>`;
  }
  if(s.type==='deck'){
    return `<div class="sheet" data-act="scrim"><div class="panel sm" role="dialog">${ptop()}<div class="sm-title">${s.id?'名前を変更':'新しい単語帳'}</div><section class="card"><div class="field" style="border:0;padding:0"><input id="deckName" placeholder="単語帳の名前" value="${esc(S.form.name||'')}" maxlength="40"></div></section><button class="cta" data-act="deck-save">${s.id?'保存':'作成'}</button></div></div>`;
  }
  if(s.type==='word'){
    const f=S.form,deck=allDecks().find(d=>d.id===s.deck);const ro=deck&&deck.builtin;
    return `<div class="sheet" data-act="scrim"><div class="panel sm" role="dialog">${ptop()}<div class="sm-title">${ro?'単語':s.wid?'単語を編集':'単語を追加'}</div>
     <section class="card"><div class="field"><button class="chip" data-act="pick-wl">${esc(L[f.l||'en-US'].name)}${ic('ud',14)}</button><input id="wT" placeholder="単語・フレーズ" value="${esc(f.t||'')}" ${ro?'readonly':''} autocapitalize="off"></div>
     <div class="field acc"><span class="lbl" style="color:var(--sub)">日本語の意味</span><input id="wM" placeholder="意味" value="${esc(f.m||'')}" ${ro?'readonly':''}></div></section>
     ${ro?`<button class="cta" data-act="word-copy">マイ単語帳に追加</button>`:`<button class="cta ghost" data-act="word-auto">足りない方を自動入力</button><button class="cta" data-act="word-save">保存</button>${s.wid?'<button class="cta danger" data-act="word-del">この単語を削除</button>':''}`}</div></div>`;
  }
  if(s.type==='account'){
    const A=S.auth,FB=window.FB;
    if(!FB)return `<div class="sheet" data-act="scrim"><div class="panel sm" role="dialog">${ptop()}<div class="sm-title">ログインの準備中</div><section class="card"><p class="empty" style="text-align:left">ログインを使うには、<b>firebase-config.js</b> にFirebaseの設定を入れて公開してください。手順はREADMEにあります。いまは無料の翻訳エンジンで使えます。</p></section></div></div>`;
    if(ME){
      const pv=(ME.providerData&&ME.providerData[0]&&ME.providerData[0].providerId)||'password';
      const pn={'google.com':'Google','github.com':'GitHub','microsoft.com':'Microsoft',password:'メールアドレス'}[pv]||pv;
      return `<div class="sheet" data-act="scrim"><div class="panel sm" role="dialog" aria-label="アカウント">${ptop()}<h2 style="font-size:28px">アカウント</h2>
       <section class="card"><div class="lbl">${esc(pn)}でログイン中</div><div class="txt" style="font-size:24px">${esc(ME.displayName||ME.email||'')}</div>${ME.displayName&&ME.email?`<div class="ex">${esc(ME.email)}</div>`:''}</section>
       <section class="card list"><div class="li"><div class="grow"><div class="t" style="font-size:18px">翻訳エンジン</div><div class="s">Google AI (Gemini)</div></div></div><div class="li"><div class="grow"><div class="t" style="font-size:18px">単語帳の同期</div><div class="s">${esc(syncState||'同期済み')}</div></div></div><div class="li"><div class="grow"><div class="t" style="font-size:18px">直近の翻訳に使ったもの</div><div class="s">${esc(lastEngine||'まだ翻訳していません')}</div></div></div></section>
       <button class="cta" data-act="gtest">Geminiを試す</button>${gtest?`<section class="card"><div class="txt" style="font-size:17px;font-weight:500;line-height:1.5">${esc(gtest)}</div></section>`:''}
       <button class="cta ghost" data-act="logout">ログアウト</button></div></div>`;
    }
    const social=(k,l)=>`<button class="cta ghost" data-act="auth-social" data-id="${k}" ${A.busy?'disabled':''}>${l}で続ける</button>`;
    const up=A.mode==='up';
    return `<div class="sheet" data-act="scrim"><div class="panel" role="dialog" aria-label="ログイン">${ptop()}<h2>${up?'アカウント作成':'ログイン'}</h2>
     <p class="subline" style="margin-top:-8px">ログインすると、Google AI (Gemini) で翻訳でき、単語帳や学習記録がどの端末でも同期されます。</p>
     <div class="rowbtns">${social('google','Google')}${social('github','GitHub')}${social('microsoft','Microsoft')}</div>
     <p class="hint">または</p>
     <section class="card" style="padding:10px 24px">${up?`<div class="field"><span class="lbl" style="color:var(--sub)">名前(任意)</span><input id="aName" autocomplete="name" value="${esc(A.name)}" placeholder="名前"></div>`:''}
      <div class="field"><span class="lbl" style="color:var(--sub)">メールアドレス</span><input id="aMail" type="email" inputmode="email" autocomplete="email" autocapitalize="off" value="${esc(A.mail)}" placeholder="name@example.com"></div>
      <div class="field"><span class="lbl" style="color:var(--sub)">パスワード</span><input id="aPass" type="password" autocomplete="${up?'new-password':'current-password'}" value="${esc(A.pass)}" placeholder="6文字以上" enterkeyhint="go"></div></section>
     ${A.err?`<div class="fb ng" role="alert" style="padding:0 6px">${esc(A.err)}</div>`:''}${A.info?`<div class="fb ok" style="padding:0 6px">${esc(A.info)}</div>`:''}
     <button class="cta" data-act="auth-go" ${A.busy?'disabled':''}>${A.busy?'処理中…':up?'アカウントを作成':'ログイン'}</button>
     <div style="display:flex;justify-content:space-between;gap:12px;padding:0 6px"><button class="chip acc" data-act="auth-mode">${up?'ログインに戻る':'アカウントを作成'}</button>${up?'':'<button class="chip" data-act="auth-reset">パスワードを忘れた</button>'}</div></div></div>`;
  }
  if(s.type==='confirm'){
    return `<div class="sheet" data-act="scrim"><div class="panel sm" role="dialog">${ptop()}<div class="sm-title">${esc(s.msg)}</div><button class="cta danger" data-act="${s.go}">${esc(s.label)}</button><button class="cta ghost" data-act="close">キャンセル</button></div></div>`;
  }
  return '';
}
function menuHTML(){
  const m=S.menu;
  return `<div class="menuwrap" data-act="menu-bg"><div class="menuin"><div class="menu ${m.left?'l':''}" role="menu">${m.items.map(i=>i.sep?'<hr>':`<button role="menuitem" data-act="${i.act}" class="${i.danger?'red':''}"><span class="ck">${i.check?ic('check',18):''}</span>${esc(i.label)}</button>`).join('')}</div></div></div>`;
}

/* ---------- 描画 ---------- */
const TABS=[['translate','翻訳','tTr'],['camera','カメラ','tCam'],['chat','会話','tChat'],['words','単語帳','tWords'],['study','学習','tStudy']];
function render(){
  const ae=document.activeElement,keep=ae&&ae.id,pos=ae&&ae.selectionStart;
  let h;
  switch(S.tab){case 'translate':h=translateHTML();break;case 'camera':h=cameraHTML();break;case 'chat':h=chatHTML();break;case 'words':h=wordsHTML();break;default:h=studyHTML()}
  $('#app').innerHTML=`<main class="screen">${h}</main><nav class="tabbar" aria-label="タブ"><div class="pillbar">${TABS.map(t=>`<button class="tab" data-act="tab" data-id="${t[0]}" aria-current="${S.tab===t[0]}">${ic(t[2],30)}<span>${t[1]}</span></button>`).join('')}</div></nav>`;
  renderLayer();fitAll();
  if(keep){const el=document.getElementById(keep);if(el&&!el.disabled){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos)}catch(e){}}}
}
function renderLayer(){
  const ae=document.activeElement,keep=ae&&ae.closest&&ae.closest('#layer')&&ae.id;
  $('#layer').innerHTML=(S.sheet?sheetHTML():'')+(S.menu?menuHTML():'');
  if(keep){const el=document.getElementById(keep);if(el)el.focus()}
}
function fit(el){el.style.height='auto';el.style.height=Math.max(el.scrollHeight,el.classList.contains('sm')?40:112)+'px'}
function fitAll(){document.querySelectorAll('.ta.auto').forEach(fit)}
function closeSheet(){S.sheet=null;S.menu=null;S.dict=null;renderLayer();render()}

/* ---------- メニュー ---------- */
function openMenu(kind){
  const M={
   tr:{items:[{label:ME?'アカウント':'ログイン',act:'acct'},{sep:1},{label:'自動翻訳',act:'t-auto',check:D.set.auto},{label:'翻訳を自動で読み上げ',act:'t-speak',check:D.set.speak},{sep:1},{label:'履歴を消去',act:'clr-hist-ask',danger:1}]},
   cam:{items:[{label:'翻訳先を変更',act:'pick-dst'},{label:'結果を消去',act:'cam-clear'}]},
   view:{left:1,items:[{label:'横並び',act:'face-0',check:!S.face},{label:'対面',act:'face-1',check:S.face}]},
   chat:{items:[{label:'翻訳を自動で読み上げ',act:'t-speak',check:D.set.speak},{sep:1},{label:'会話を消去',act:'chat-clear',danger:1}]},
   deck:{items:(()=>{const d=allDecks().find(x=>x.id===S.deckOpen);return d&&!d.builtin&&d.id!=='my'?[{label:'名前を変更',act:'deck-rename'},{label:'単語帳を削除',act:'deck-del-ask',danger:1}]:d&&!d.builtin?[{label:'名前を変更',act:'deck-rename'}]:[{label:'マイ単語帳へすべて追加',act:'deck-copyall'}]})()}
  };
  S.menu=M[kind];renderLayer();
}

/* ---------- イベント ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t){if(S.menu){S.menu=null;renderLayer()}return}
  const a=t.dataset.act;
  if((a==='scrim'||a==='menu-bg')&&e.target!==t&&!(a==='scrim'&&S.sheet&&S.sheet.type==='expand'))return;
  if(a==='menu-bg'){S.menu=null;renderLayer();return}
  act(a,t);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.menu){S.menu=null;renderLayer()}else if(S.sheet)closeSheet();return}
  const el=e.target;
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){
    if(el.id==='inA'){e.preventDefault();submit('A')}
    else if(el.id==='inB'){e.preventDefault();submit('B')}
    else if(el.id==='chA'){e.preventDefault();sendChat('A')}
    else if(el.id==='chB'){e.preventDefault();sendChat('B')}
    else if(el.id==='spell'){e.preventDefault();act('check')}
    else if(el.id==='deckName'){e.preventDefault();act('deck-save')}
    else if(el.id==='aPass'||el.id==='aMail'){e.preventDefault();act('auth-go')}
    else if(el.classList&&el.classList.contains('li')&&el.getAttribute('role')==='button'){e.preventDefault();el.click()}
    else if(el.getAttribute&&el.getAttribute('role')==='button'&&el.dataset.act){e.preventDefault();el.click()}
  }
});
document.addEventListener('input',e=>{
  const el=e.target,id=el.id;
  if(el.classList.contains('auto'))fit(el);
  if(id==='inA'){S.inA=el.value;clearTimeout(autoT);if(D.set.auto&&el.value.trim())autoT=setTimeout(()=>submit('A',true),1100)}
  else if(id==='inB'){S.inB=el.value}
  else if(id==='chA')S.chA=el.value;else if(id==='chB')S.chB=el.value;
  else if(id==='spell'){if(S.quiz)S.quiz.spell=el.value}
  else if(id==='deckName')S.form.name=el.value;
  else if(id==='aMail')S.auth.mail=el.value;else if(id==='aPass')S.auth.pass=el.value;else if(id==='aName')S.auth.name=el.value;
  else if(id==='wT')S.form.t=el.value;else if(id==='wM')S.form.m=el.value;
});
document.addEventListener('change',e=>{
  if(e.target.id==='camIn'||e.target.id==='libIn'){const f=e.target.files&&e.target.files[0];e.target.value='';onPhoto(f)}
});
document.addEventListener('focusin',e=>{if(e.target.id==='chA')lastSide='A';if(e.target.id==='chB')lastSide='B'});

function act(a,t){
  const ds=(t&&t.dataset)||{};const id=ds.id;
  const it=id?findItem(id):null;
  switch(a){
   case 'tab':S.tab=id;S.menu=null;S.sheet=null;S.dict=null;render();window.scrollTo(0,0);break;
   case 'favs':S.sheet={type:'favs'};renderLayer();break;
   case 'acct':S.menu=null;S.auth.err='';S.auth.info='';S.sheet={type:'account'};renderLayer();break;
   case 'auth-mode':S.auth.mode=S.auth.mode==='up'?'in':'up';S.auth.err='';S.auth.info='';renderLayer();break;
   case 'auth-go':authGo();break;
   case 'auth-social':authSocial(id);break;
   case 'auth-reset':authReset();break;
   case 'gtest':{gtest='テスト中…';renderLayer();
     window.FB.translate('こんにちは','日本語','英語 (アメリカ)').then(t=>{gtest='成功しました。Geminiの返事:「'+t+'」'}).catch(e=>{gtest='失敗しました: '+((e&&e.code)||'')+' '+String((e&&e.message)||e).slice(0,200)}).then(()=>{if(S.sheet&&S.sheet.type==='account')renderLayer()});break}
   case 'logout':window.FB.logout().then(()=>{S.sheet=null;toast('ログアウトしました');render()});break;
   case 'close':case 'scrim':closeSheet();break;
   case 'menu-tr':openMenu('tr');break;case 'menu-cam':openMenu('cam');break;case 'menu-view':openMenu('view');break;case 'menu-chat':openMenu('chat');break;case 'menu-deck':openMenu('deck');break;
   case 't-auto':D.set.auto=!D.set.auto;save();S.menu=null;renderLayer();toast(D.set.auto?'自動翻訳をオンにしました':'自動翻訳をオフにしました');break;
   case 't-speak':D.set.speak=!D.set.speak;save();S.menu=null;renderLayer();toast(D.set.speak?'翻訳を自動で読み上げます':'自動読み上げをオフにしました');break;
   case 'clr-hist-ask':S.menu=null;S.sheet={type:'confirm',msg:'履歴をすべて消去しますか?',label:'履歴を消去',go:'clr-hist'};renderLayer();break;
   case 'clr-hist':D.hist=[];save();S.res=null;S.sheet=null;render();toast('履歴を消去しました');break;
   case 'cam-clear':S.cam=null;S.menu=null;render();break;
   case 'face-0':case 'face-1':S.face=a==='face-1';S.menu=null;render();break;
   case 'chat-clear':S.msgs=[];S.menu=null;render();break;
   case 'pick-src':S.menu=null;S.sheet={type:'lang',slot:'src'};renderLayer();break;
   case 'pick-dst':S.menu=null;S.sheet={type:'lang',slot:'dst'};renderLayer();break;
   case 'pick-wl':S.sheet=Object.assign({},S.sheet,{type:'lang',slot:'wl',back:S.sheet});renderLayer();break;
   case 'setlang':{
     const c=ds.code,sl=S.sheet.slot;
     if(sl==='wl'){S.form.l=c;S.sheet=S.sheet.back;renderLayer();break}
     if(sl==='src'){if(c===S.dst){S.dst=S.src}S.src=c}else{if(c===S.src){S.src=S.dst}S.dst=c}
     D.src=S.src;D.dst=S.dst;save();S.sheet=null;render();break}
   case 'swap':{const x=S.src;S.src=S.dst;S.dst=x;const y=S.inA;S.inA=S.inB;S.inB=y;D.src=S.src;D.dst=S.dst;save();render();break}
   case 'mic-A':mic(S.src,tx=>{S.inA=tx;render();submit('A')});break;
   case 'mic-B':mic(S.dst,tx=>{S.inB=tx;render();submit('B')});break;
   case 'mic-chat':mic(lastSide==='A'?S.src:S.dst,tx=>sendChat(lastSide,tx));break;
   case 'say-s':if(it)speak(it.s,L[it.from].tts);break;
   case 'say-t':if(it)speak(it.t,L[it.to].tts);break;
   case 'expand':if(it){S.sheet=Object.assign({},{type:'expand',id:id,back:S.sheet});renderLayer()}break;
   case 'fav':if(it){const i=D.favs.findIndex(f=>f.id===it.id);if(i>=0)D.favs.splice(i,1);else D.favs.unshift({id:it.id,from:it.from,to:it.to,s:it.s,t:it.t});save();
     if(S.sheet&&S.sheet.type==='favs'){const sc=document.querySelector('.panel').scrollTop;renderLayer();document.querySelector('.panel').scrollTop=sc;render()}else render()}break;
   case 'copy':if(it)copy(it.t);break;
   case 'dict':if(it)openDict(it);break;
   case 'dict-add':if(S.dict&&S.dict.item){addFromItem(S.dict.item)}break;
   case 'msg-say':{const m=S.msgs[+ds.i];if(m)speak(m.t,L[m.side==='A'?S.dst:S.src].tts);break}
   case 'shoot':{const el=$('#camIn');if(el)el.click();break}
   case 'lib':{const el=$('#libIn');if(el)el.click();break}
   /* 単語帳 */
   case 'back':S.deckOpen=null;render();break;
   case 'deck-open':S.deckOpen=id;render();window.scrollTo(0,0);break;
   case 'deck-new':S.form={name:''};S.sheet={type:'deck'};renderLayer();setTimeout(()=>{const e=$('#deckName');e&&e.focus()},80);break;
   case 'deck-rename':{const d=allDecks().find(x=>x.id===S.deckOpen);S.menu=null;S.form={name:d.name};S.sheet={type:'deck',id:d.id};renderLayer();break}
   case 'deck-save':{const n=(S.form.name||'').trim();if(!n){toast('名前を入力してください');break}
     if(S.sheet.id){const d=D.decks.find(x=>x.id===S.sheet.id);if(d)d.name=n}else D.decks.push({id:'d'+Date.now().toString(36),name:n,words:[]});
     save();S.sheet=null;render();break}
   case 'deck-del-ask':S.menu=null;S.sheet={type:'confirm',msg:'この単語帳を削除しますか?',label:'削除',go:'deck-del'};renderLayer();break;
   case 'deck-del':D.decks=D.decks.filter(d=>d.id!==S.deckOpen);if(S.sdeck===S.deckOpen)S.sdeck='basic';S.deckOpen=null;S.sheet=null;save();render();break;
   case 'deck-copyall':{let n=0;BUILTIN.words.forEach(w=>{if(addWordTo(myDeck(),w))n++});S.menu=null;renderLayer();toast(n+'語を追加しました');break}
   case 'word-new':S.form={t:'',m:'',l:'en-US'};S.sheet={type:'word',deck:S.deckOpen};renderLayer();break;
   case 'word-open':{const d=allDecks().find(x=>x.id===S.deckOpen);const w=d.words.find(x=>x.id===id);if(!w)break;S.form={t:w.t,m:w.m,l:w.l};S.sheet={type:'word',deck:d.id,wid:d.builtin?null:w.id};renderLayer();break}
   case 'word-copy':{const f=S.form;toast(addWordTo(myDeck(),{t:f.t,m:f.m,l:f.l})?'「'+myDeck().name+'」に追加しました':'すでに追加されています');break}
   case 'word-save':{const f=S.form;if(!(f.t||'').trim()||!(f.m||'').trim()){toast('単語と意味の両方を入力してください');break}
     const d=D.decks.find(x=>x.id===S.sheet.deck);if(!d)break;
     if(S.sheet.wid){const w=d.words.find(x=>x.id===S.sheet.wid);if(w){w.t=f.t.trim();w.m=f.m.trim();w.l=f.l||'en-US'}save()}
     else if(!addWordTo(d,{t:f.t.trim(),m:f.m.trim(),l:f.l||'en-US'})){toast('すでに追加されています');break}
     S.sheet=null;render();break}
   case 'word-del':{const d=D.decks.find(x=>x.id===S.sheet.deck);if(d)d.words=d.words.filter(w=>w.id!==S.sheet.wid);save();S.sheet=null;render();break}
   case 'word-auto':autoFill();break;
   case 'say-w':{let w=null;if(S.quiz){w=S.quiz.ws.find(x=>x.id===id)||S.quiz.ws[S.quiz.i]}
     if(!w||(id&&w.id!==id)){const d=allDecks().find(x=>x.id===S.deckOpen)||BUILTIN;w=d.words.find(x=>x.id===id)||w}
     if(w)speak(w.t,L[w.l].tts);break}
   /* 学習 */
   case 's-deck':S.sdeck=id;render();break;
   case 's-mode':S.smode=id;render();break;
   case 's-count':S.scount=id;render();break;
   case 'start':startQuiz();break;
   case 'qclose':if(S.quiz)clearTimeout(S.quiz.timer);S.quiz=null;render();break;
   case 'pick':{const q=S.quiz;if(!q||q.done)break;const i=+ds.i;answer(!!q.opts[i].ok,i);break}
   case 'check':{const q=S.quiz;if(!q||q.done)break;const w=q.ws[q.i];
     const n=s=>s.trim().toLowerCase().replace(/\s+/g,' ').replace(/[.!?]+$/,'');
     const v=($('#spell')||{value:q.spell}).value;q.spell=v;if(!v.trim()){toast('スペルを入力してください');break}answer(n(v)===n(w.t),null);break}
   case 'idk':answer(false,null);break;
   case 'next':next();break;
   case 'retry':{const w=S.quiz.wrong.slice();startQuiz(shuffle(w));break}
   case 'again':S.quiz=null;render();break;
  }
}
/* 画面の再描画時に拡大表示から戻るためのフック */
const _closeSheet=closeSheet;
closeSheet=function(){const b=S.sheet&&S.sheet.back;S.menu=null;S.dict=null;S.sheet=b||null;renderLayer();render()};

async function authRun(fn){
  const A=S.auth;A.busy=true;A.err='';A.info='';renderLayer();
  try{await fn()}catch(e){A.err=authMsg(e)}
  A.busy=false;if(S.sheet&&S.sheet.type==='account')renderLayer();
}
function authGo(){
  const A=S.auth;if(A.busy)return;
  if(!A.mail.trim()||!A.pass){A.err='メールアドレスとパスワードを入力してください';renderLayer();return}
  authRun(async()=>{if(A.mode==='up')await window.FB.signup(A.mail.trim(),A.pass,A.name.trim());else await window.FB.login(A.mail.trim(),A.pass);A.pass='';S.sheet=null;render()});
}
function authSocial(k){if(S.auth.busy)return;authRun(async()=>{await window.FB.social(k);S.sheet=null;render()})}
function authReset(){
  const A=S.auth;if(!A.mail.trim()){A.err='パスワードを再設定するメールアドレスを入力してください';renderLayer();return}
  authRun(async()=>{await window.FB.reset(A.mail.trim());A.info='再設定のメールを送りました'});
}
async function openDict(it){
  const term=it.from==='ja'?it.t:it.s,termL=it.from==='ja'?it.to:it.from;
  S.dict={item:it,loading:true};S.sheet={type:'dict'};renderLayer();
  try{
    let r=null;
    if(ME&&window.FB){try{r=await window.FB.dict(term,L[termL].name)}catch(e){r=null}}
    if(!r)r=await dictLookup(term,termL,'ja');
    S.dict={item:it,loading:false,data:r};
  }catch(e){S.dict={item:it,loading:false,err:errMsg(e)}}
  if(S.sheet&&S.sheet.type==='dict')renderLayer();
}
async function autoFill(){
  const f=S.form;
  try{
    if((f.t||'').trim()&&!(f.m||'').trim()){toast('翻訳中…');f.m=await translate(f.t.trim(),f.l||'en-US','ja')}
    else if((f.m||'').trim()&&!(f.t||'').trim()){toast('翻訳中…');f.t=await translate(f.m.trim(),'ja',f.l||'en-US')}
    else{toast('どちらか片方を入力してください');return}
    renderLayer();
  }catch(e){toast(errMsg(e))}
}

render();
})();
</script>
